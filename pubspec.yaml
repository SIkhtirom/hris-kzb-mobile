name: field_supervisor_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.3
  table_calendar: ^3.2.1
  equatable: ^2.1.0
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_secure_storage: ^11.1.0
  http: ^1.5.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo-kzb.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo-kzb.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/logo-kzb.png
    background_color: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/images/splash_screen.png
  image_dark: assets/images/splash_screen.png
  android: true
  ios: true
  web: true
  android_12:
    image: assets/images/splash_screen_android12.png
    color: "#FFFFFF"
    image_dark: assets/images/splash_screen_android12.png
    color_dark: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
